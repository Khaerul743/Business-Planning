services:
  redis:
    image: redis:7-alpine
    container_name: wa_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wa_network

  wa-bridge:
    build:
      context: ./backend/apps/wa-bridge
      dockerfile: Dockerfile
    container_name: wa_bridge_service
    ports:
      - "3001:3001"
    env_file:
      - ./backend/apps/wa-bridge/.env
    environment:
      - PORT=3001
      - FASTAPI_URL=http://backend-api:8000
      - SESSION_PATH=.wwebjs_auth
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - wa_bridge_session:/app/.wwebjs_auth
    restart: unless-stopped
    networks:
      - wa_network

  backend-api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: wa_backend_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/apps/api/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_WEB_SERVICE=http://wa-bridge:3001
      - LANGGRAPH_SERVER=http://agent-service:2024
    volumes:
      - chroma_storage:/app/apps/api/chromadb
      - document_storage:/app/apps/api/documents
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - wa_network

  generator-worker:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: wa_generator_worker
    command: python start_generator_worker.py
    env_file:
      - ./backend/apps/api/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_WEB_SERVICE=http://wa-bridge:3001
      - LANGGRAPH_SERVER=http://agent-service:2024
    volumes:
      - chroma_storage:/app/apps/api/chromadb
      - document_storage:/app/apps/api/documents
    depends_on:
      - redis
      - backend-api
    restart: unless-stopped
    networks:
      - wa_network

  message-worker:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: wa_message_worker
    command: python start_message_worker.py
    env_file:
      - ./backend/apps/api/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_WEB_SERVICE=http://wa-bridge:3001
      - LANGGRAPH_SERVER=http://agent-service:2024
    volumes:
      - chroma_storage:/app/apps/api/chromadb
      - document_storage:/app/apps/api/documents
    depends_on:
      - redis
      - backend-api
      - wa-bridge
    restart: unless-stopped
    networks:
      - wa_network

  agent-service:
    build:
      context: ./backend
      dockerfile: apps/agent/Dockerfile
    container_name: wa_agent_service
    ports:
      - "2024:2024"
    env_file:
      - ./backend/apps/agent/.env
    environment:
      - BACKEND_URL=http://backend-api:8000
    depends_on:
      - backend-api
    restart: unless-stopped
    networks:
      - wa_network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: wa_frontend
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./frontend/.env
  #   environment:
  #     - BACKEND_SERVICE_URL=http://backend-api:8000
  #     - NEXT_PUBLIC_BACKEND_SERVICE_URL=http://localhost:8000
  #     - NEXT_PUBLIC_WS_URL=ws://localhost:8000
  #   depends_on:
  #     - backend-api
  #   restart: unless-stopped
